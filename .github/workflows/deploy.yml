name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  produccion:
    name: Produccion (Windows + IIS)
    runs-on: [self-hosted, windows-iis]
    steps:
      - name: Desplegar
        shell: powershell
        run: |
          Set-Location C:\matriz
          git fetch origin main
          git reset --hard origin/main
          .\deploy.ps1
